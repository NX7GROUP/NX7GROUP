<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NX7 Group | روابطنا الرسمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #081229;
            --card: rgba(17, 30, 60, 0.7);
            --gold: #f5a623;
            --white: #ffffff;
            --radius: 20px;
        }
        body {
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }
        .profile { text-align: center; margin-bottom: 30px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--gold); margin-bottom: 15px; }
        .profile h2 { margin: 0; font-size: 1.4rem; }
        .profile p { color: var(--gold); font-size: 0.9rem; margin-top: 5px; }

        .links-container { width: 100%; max-width: 450px; }
        .link-card {
            background: var(--card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 15px;
            text-decoration: none;
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease forwards;
        }
        .link-card:hover {
            transform: scale(1.03);
            border-color: var(--gold);
            background: rgba(17, 30, 60, 0.9);
        }
        .link-info { display: flex; align-items: center; gap: 15px; }
        .link-info i { font-size: 1.5rem; color: var(--gold); width: 30px; text-align: center; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .footer-logo { margin-top: auto; padding-top: 40px; font-weight: bold; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="profile">
        <div class="profile-img"><img src="https://via.placeholder.com/100" style="width:100%; border-radius:50%;" alt="NX7 Logo"></div>
        <h2>NX7 Technology & Innovation</h2>
        <p>نبتكر المستقبل بأدوات اليوم</p>
    </div>

    <div class="links-container" id="links-list">
        </div>

    <div class="footer-logo">NX7 GROUP</div>

    <script>
        async function loadLinks() {
            try {
                const response = await fetch('links.json');
                const data = await response.json();
                const container = document.getElementById('links-list');
                
                Object.keys(data.products).forEach(id => {
                    const item = data.products[id];
                    const icon = item.type === 'amazon' ? 'fa-amazon' : (item.type === 'academy' ? 'fa-graduation-cap' : 'fa-link');
                    
                    const card = `
                        <a href="redirect.html?id=${id}" class="link-card">
                            <div class="link-info">
                                <i class="fa-brands ${icon} || fa-solid ${icon}"></i>
                                <span>${item.title}</span>
                            </div>
                            <i class="fa-solid fa-chevron-left" style="font-size: 0.8rem; opacity: 0.5;"></i>
                        </a>
                    `;
                    container.innerHTML += card;
                });
            } catch (e) { console.error("Error loading links:", e); }
        }
        window.onload = loadLinks;
    </script>
</body>
</html>
